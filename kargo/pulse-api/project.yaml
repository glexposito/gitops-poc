# The Kargo Project for pulse-api. Kargo adopts the pulse-api namespace on
# management (created up front by cluster/bootstrap.sh with the
# kargo.akuity.io/project label, so the git credential Secret can be put in
# it before this syncs). Every Kargo resource below lives in that namespace.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: pulse-api
---
# internal and stg promote automatically as soon as Freight is available
# to them; prod has no policy, so it waits for a person to click Promote
# (UI) or run `kargo promote`.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: pulse-api
  namespace: pulse-api
spec:
  promotionPolicies:
    - stageSelector:
        name: internal
      autoPromotionEnabled: true
    - stageSelector:
        name: stg
      autoPromotionEnabled: true
