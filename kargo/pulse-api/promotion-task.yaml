# The promotion steps every pulse-api Stage runs (kargo/pulse-api/stages.yaml)
# - the same job pulse-api's CI deploy.yml does, run by Kargo on the
# management cluster instead of by a GitHub runner. It targets the Kargo
# copy of the app (apps/pulse-api-kargo, Argo CD apps pulse-api-kargo-<stage>)
# so the CI and Kargo paths never touch each other's files.
#
#   1. clone gitops-poc, pin the Freight's app digest in
#      apps/pulse-api-kargo/overlays/<stage>, commit, push
#   2. argocd-update: pin pulse-api-kargo-<stage> to exactly that commit and
#      sync it (CI does the same with `argocd app sync --revision`)
#
# Git uses the SSH URL and the credential Secret cluster/bootstrap.sh
# creates; argocd-update must use the Application's own (HTTPS) repoURL
# exactly.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: pulse-api
spec:
  vars:
    - name: gitRepo
      value: git@github.com:glexposito/gitops-poc.git
    - name: argocdRepo
      value: https://github.com/glexposito/gitops-poc.git
    - name: image
      value: ghcr.io/glexposito/pulse-api
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
          - branch: main
            path: ./repo
    - uses: kustomize-set-image
      config:
        path: ./repo/apps/pulse-api-kargo/overlays/${{ ctx.stage }}
        images:
          - image: ${{ vars.image }}
            digest: ${{ imageFrom(vars.image).Digest }}
    - uses: git-commit
      config:
        path: ./repo
        message: "pulse-api-kargo: promote ${{ imageFrom(vars.image).Tag }} to ${{ ctx.stage }}"
    - uses: git-push
      as: push
      config:
        path: ./repo
    - uses: argocd-update
      config:
        apps:
          - name: pulse-api-kargo-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.argocdRepo }}
                # The commit actually pushed (after any rebase onto a newer
                # main), not the local one.
                desiredRevision: ${{ task.outputs['push'].commit }}
                # Pins the Application's targetRevision to that commit, so a
                # later push to main (e.g. from the CI path) can't be what
                # gets synced and health-checked.
                updateTargetRevision: true
