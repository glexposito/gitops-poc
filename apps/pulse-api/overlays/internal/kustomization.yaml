# pulse-api on internal: replica count and the image it runs.
#
# images: pins an exact digest, never a tag - starts on the image built
# from glexposito/pulse-api@247711f (tag sha-247711f).
# pulse-api's CI pipeline then replaces the digest: here (kustomize edit set
# image) right after each build - internal is the first stage, so it
# gets every new image before stg and prod do - don't hand-edit it
# unless you mean to deploy (or roll back).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
replicas:
- count: 1
  name: pulse-api
images:
- digest: sha256:f89380760d6463fb21781b0dd724e4b178319bbbbb8b12d863b5aadd35a8caff
  name: ghcr.io/glexposito/pulse-api
