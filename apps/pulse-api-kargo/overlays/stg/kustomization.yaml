# pulse-api (Kargo copy) on stg: replica count and the image it runs.
#
# images: pins an exact digest, never a tag. Kargo's promote task
# (kargo/shared/promote-kustomize-app.yaml) replaces it once the Freight is
# available to stg - don't hand-edit it unless you mean to deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
replicas:
- count: 2
  name: pulse-api
images:
- digest: sha256:3e4abc2bc52c2e5e1d12694294b42cc86a3e03aa6c9dcf4c62690a3e68debfc3
  name: ghcr.io/glexposito/pulse-api
