# One pulse-api Application per workload cluster (pulse-api-internal,
# -stg, -prod), each tracking its own overlay's pinned image digest.
#
# Manual sync only - unlike everything else, these are NOT auto-synced.
# pulse-api's pipeline commits a stage's new digest
# (apps/pulse-api/overlays/<stage>), then runs
# `argocd app sync --revision <that commit>`, waits until Healthy, and runs
# e2e before promoting to the next stage (internal -> stg -> prod).
# Argo CD rejects `sync --revision` on auto-synced apps, and pinning the
# revision guarantees the pipeline deploys exactly the commit it pushed.
# Trade-off: no selfHeal - drift shows as OutOfSync but isn't reverted, and
# manual commits to the overlays only go live on the next sync.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pulse-api-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - stage: internal
            server: https://k3s-internal:6443
          - stage: stg
            server: https://k3s-stg:6443
          - stage: prod
            server: https://k3s-prod:6443
  template:
    metadata:
      name: 'pulse-api-{{stage}}'
      namespace: argocd
      labels:
        stage: '{{stage}}'
        environment: '{{stage}}'
    spec:
      project: pulse-api
      source:
        repoURL: https://github.com/glexposito/k8s-keda-poc.git
        targetRevision: HEAD
        path: 'apps/pulse-api/overlays/{{stage}}'
      destination:
        server: '{{server}}'
        namespace: 'pulse-api'
