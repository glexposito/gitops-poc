# One pulse-api Application per workload cluster (pulse-api-internal,
# -stg, -prod), each tracking its own overlay's pinned image digest.
#
# Auto-synced like everything else. Promotion is still gated: pulse-api's
# pipeline only commits a stage's new digest (apps/pulse-api/overlays/<stage>)
# after the previous stage's e2e passed, then runs `argocd app sync` right
# away (instead of waiting for the ~3 min poll), waits until Healthy, and
# runs e2e (internal -> stg -> prod).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pulse-api-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - stage: internal
            server: https://k3s-internal:6443
          - stage: stg
            server: https://k3s-stg:6443
          - stage: prod
            server: https://k3s-prod:6443
  template:
    metadata:
      name: 'pulse-api-{{stage}}'
      namespace: argocd
      labels:
        stage: '{{stage}}'
        environment: '{{stage}}'
    spec:
      project: pulse-api
      source:
        repoURL: https://github.com/glexposito/k8s-keda-poc.git
        targetRevision: HEAD
        path: 'apps/pulse-api/overlays/{{stage}}'
      destination:
        server: '{{server}}'
        namespace: 'pulse-api'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
